---
name: Prod-CD
on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check the released commit passed Staging-CD and acceptance, then simulate the prod deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          released=$(git rev-parse HEAD^2 2>/dev/null) || { echo "::error::HEAD is not a merge commit"; exit 1; }
          results=$(gh api "repos/$GITHUB_REPOSITORY/commits/$released/status" \
            --jq '[([.statuses[] | select(.context == "staging-cd") | .state] | first // "none"), ([.statuses[] | select(.context == "Staging – acceptance") | .state] | first // "none")] | join(" ")')
          if [[ "$results" != "success success" ]]; then
            echo "::error::released commit $released did not pass staging (staging-cd and acceptance: $results)"
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$released" \
            -f state=success -f context=prod-deployed -f description="Simulated production deploy" --silent
          echo "Deployed $released to (simulated) production"
