---
name: Staging-CD
on:
  push:
    tags:
      - "staging-pipeline/*"

concurrency:
  group: staging-cd
  cancel-in-progress: false

jobs:
  find_base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Find the last verified commit
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/branches/prod-release" --jq '.commit.sha' 2>/dev/null || true)
          relation=""
          if [[ -n "$base" ]]; then
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq '.status' 2>/dev/null || true)
          fi
          if [[ "$relation" == "ahead" ]]; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
            echo "Checking changes since prod-release ($base)"
          else
            echo "prod-release is missing or not behind $GITHUB_SHA, running every check"
          fi

  changes:
    runs-on: ubuntu-latest
    needs:
      - find_base
    outputs:
      knock: ${{ needs.find_base.outputs.sha == '' && 'true' || steps.changed.outputs.knock_any_changed }}
      frontend: ${{ needs.find_base.outputs.sha == '' && 'true' || steps.changed.outputs.frontend_any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the base commit
        if: needs.find_base.outputs.sha != ''
        env:
          BASE_SHA: ${{ needs.find_base.outputs.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Find changed files
        id: changed
        if: needs.find_base.outputs.sha != ''
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        with:
          base_sha: ${{ needs.find_base.outputs.sha }}
          sha: ${{ github.sha }}
          skip_initial_fetch: true
          files_yaml: |
            knock:
              - packages/transactional/**
            frontend:
              - apps/dashboard/**

  tests:
    runs-on: ubuntu-latest
    needs:
      - find_base
    steps:
      - uses: actions/checkout@v4
      - name: Simulated Go and JS tests
        run: |
          source sim.env
          sleep "${TESTS_SECONDS:-15}"
          echo "tests=$TESTS"
          [[ "$TESTS" == "pass" ]]

  build_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulated image build
        run: |
          source sim.env
          sleep 10
          echo "build=$BUILD"
          [[ "$BUILD" == "pass" ]]

  vercel_build:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build_images
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Simulated frontend deploy to staging
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          sleep 10
          gh variable set STAGING_FRONTEND_SHA --repo "$GITHUB_REPOSITORY" --body "$GITHUB_SHA"
          echo "staging frontend now serves $GITHUB_SHA"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_images
      - vercel_build
    if: >-
      !cancelled() &&
      needs.build_images.result == 'success'
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Create the Staging deployment and hand it to the simulated ArgoCD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(jq -n --arg ref "$GITHUB_SHA" \
            '{ref: $ref, environment: "Staging", auto_merge: false, required_contexts: [], description: "Staging deploy for \($ref)"}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress --silent
          GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=fake-argocd-sync -f "client_payload[sha]=$GITHUB_SHA" -f "client_payload[deployment]=$id"
          echo "Handed $GITHUB_SHA (deployment $id) to the simulated ArgoCD"

  knock_templates:
    needs:
      - changes
    permissions:
      statuses: write
    if: needs.changes.outputs.knock == 'true'
    uses: ./.github/workflows/knock-templates.yml
    secrets: inherit
